[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xhtang-harness"
version = "0.1.0"
description = "Small Python foundation for an LLM agent harness demo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
xhtang-harness = "xhtang_harness.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["xhtang_harness"]
strict = true
